# Configuration for auto-generated release notes
# See: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
    authors:
      - dependabot
      - github-actions

  categories:
    - title: "🚀 New Features"
      labels:
        - enhancement
        - feature

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
        - bugfix

    - title: "📚 Documentation"
      labels:
        - documentation
        - docs

    - title: "🔧 Maintenance"
      labels:
        - chore
        - maintenance
        - refactor

    - title: "⬆️ Dependencies"
      labels:
        - dependencies
        - deps

    - title: "🔒 Security"
      labels:
        - security

    - title: "Other Changes"
      labels:
        - "*"