# .github/release.yaml
# Auto-generated release notes configuration
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions[bot]

  categories:
    - title: "💥 Breaking Changes"
      labels:
        - breaking
        - breaking-change

    - title: "🚀 New Features"
      labels:
        - enhancement
        - feature
        - feat

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
        - bugfix
        - hotfix

    - title: "⚡ Performance"
      labels:
        - performance
        - perf

    - title: "🔒 Security"
      labels:
        - security

    - title: "📚 Documentation"
      labels:
        - documentation
        - docs

    - title: "🎨 Styling"
      labels:
        - style
        - ui
        - ux

    - title: "♻️ Refactoring"
      labels:
        - refactor
        - cleanup
        - tech-debt

    - title: "🧪 Tests"
      labels:
        - test
        - tests
        - testing

    - title: "📦 Dependencies"
      labels:
        - dependencies
        - deps

    - title: "🔧 CI/CD & Build"
      labels:
        - ci
        - build
        - infrastructure

    - title: "🗑️ Deprecated"
      labels:
        - deprecated

    - title: "📝 Other Changes"
      labels:
        - "*"