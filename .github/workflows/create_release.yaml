name: Build and Release Package

on:
  push:
    branches: [main]

jobs:
  build_and_package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]+' backend/pyproject.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install and Build Web Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Prepare Docker Templates
        run: |
          find docker/backend -mindepth 1 ! -name '.gitkeep' -delete
          find docker/frontend -mindepth 1 ! -name '.gitkeep' -delete
          cp backend/.env.example docker/backend/.env
          cp .env.example .env
          # The frontend fetches /config.json and parses it as JSON (see
          # frontend/src/utils/config.js). Shipping the YAML example meant the
          # fetch always failed and the release fell back to the built-in default.
          cp frontend/public/config.example.json docker/frontend/config.json

      - name: Copy Frontend Build
        run: |
          cp -r frontend/dist/* docker/frontend/

      - name: Copy Backend Files
        run: |
          cp backend/app.py docker/backend/
          cp backend/requirements.txt docker/backend/
          mkdir -p docker/backend/uploads

      - name: Clean up backup files
        run: |
          find . -name "*.bak" -delete

      - name: Prepare Release Structure
        run: |
          mkdir clippy
          rm -rf backend/ frontend/ .github/ logo/ build.sh
          shopt -s extglob dotglob
          mv !(clippy) clippy/

      - name: Create Release ZIP
        run: |
          zip -r release.zip clippy/

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Clippy v${{ steps.version.outputs.version }}
          files: release.zip
          generate_release_notes: true
