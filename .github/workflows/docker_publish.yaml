name: Publish Docker Image

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]+' backend/pyproject.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    if: success()
    # id-token is required to mint the OIDC assertion; nothing else is needed.
    # Previously unset, so this job inherited the repository default, which on
    # older repos is read-write-all.
    permissions:
      id-token: write
      contents: read

    steps:
      # Short-lived credentials scoped to this repo and branch, replacing a
      # permanent IAM access key held in repository secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      # Deploy the immutable v<version> tag rather than :latest, so the rollout
      # is the artifact this run built and a rollback is a tag change.
      - name: Deploy to EC2 via SSM
        id: send
        env:
          TAG: v${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[\"cd /opt/clippy && sed -i '/^CLIPPY_TAG=/d' .env && echo CLIPPY_TAG=$TAG >> .env && docker compose pull && docker compose up -d\"]" \
            --comment "Deploy Clippy ${{ github.sha }}" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      # send-command only queues the work. Without this the job went green on a
      # failed image pull, a crash-looping container or an offline SSM agent.
      - name: Wait for deploy to finish
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true
          status=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' --output text
          echo "SSM status: $status"
          [ "$status" = "Success" ]

      - name: Verify the site is actually serving
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://clippy.smashit.tw/api/v2/config >/dev/null; then
              echo "Health check passed"; exit 0
            fi
            echo "attempt $i failed, retrying..."; sleep 10
          done
          echo "Health check never passed after deploy" >&2; exit 1
