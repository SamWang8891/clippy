[project]
name = "clippy-backend"
version = "1.5.2"
description = "Clippy - Collaborative clipboard backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.0",
    "cryptography>=44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]
ignore = ["E501", "SIM105"]  # SIM105 prefers contextlib.suppress; subjective.

[tool.pytest.ini_options]
testpaths = ["tests"]
