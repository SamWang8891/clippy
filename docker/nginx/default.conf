limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
# /r/ serves decrypted plaintext behind a short code, so it is the endpoint that
# most needs a brute-force brake — it previously had none.
limit_req_zone $binary_remote_addr zone=rawlimit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=wsconn:10m;
# The lobby feed is unauthenticated and every visitor idling on the entry page
# holds one, so it gets its own budget. Sharing wsconn meant twenty people
# behind one NAT — or one attacker opening twenty anonymous sockets — could
# stop anyone else on that address from opening a session socket at all.
limit_conn_zone $binary_remote_addr zone=wslobby:10m;

# When another proxy (TLS terminator, ALB) sits in front, $binary_remote_addr is
# that proxy's address and every limiter above collapses into one global bucket.
# Trust the private ranges a sibling proxy would come from and key on the real IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    absolute_redirect off;
    client_max_body_size 0;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Opaque ciphertext and same-origin assets only — nothing here needs to load
    # third-party script, frame the app, or leak referrers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # blob: is allowed for images only: thumbnails are decrypted in the tab and
    # painted from an object URL. Nothing else may load from blob:.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location / {
        limit_req zone=mylimit burst=10 nodelay;
        root /web;
        index index.html;
    }

    location /r/ {
        limit_req zone=rawlimit burst=5 nodelay;
        proxy_pass http://clippy-python:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /u/ {
        limit_req zone=mylimit burst=10 nodelay;
        # The curl handler must hold the whole body in memory to encrypt it, so
        # cap it here rather than letting nginx spool an arbitrary amount to disk
        # first. Keep in step with MAX_CURL_UPLOAD_MIB in the backend.
        client_max_body_size 64m;
        proxy_pass http://clippy-python:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        limit_req zone=mylimit burst=10 nodelay;
        proxy_pass http://clippy-python:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads straight to the app. With buffering on, nginx writes the
        # entire body to a temp file first, so a large upload occupies the disk
        # twice over (nginx temp + the app's own copy) before it can be stored.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # No CORS headers here: FastAPI's CORSMiddleware already emits them from
        # ALLOWED_ORIGINS. A blanket `add_header ... *` both duplicated the header
        # on allowed origins (browsers reject multiple values) and overrode the
        # allowlist on disallowed ones, making ALLOWED_ORIGINS do nothing.
    }

    # Exact match, so it is chosen over the /ws prefix below.
    location = /ws/lobby {
        limit_conn wslobby 5;
        proxy_pass http://clippy-python:8123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /ws {
        limit_conn wsconn 20;
        proxy_pass http://clippy-python:8123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    error_page 404 /;
}
