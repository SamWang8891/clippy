<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
	<title>Clippy</title>
	<meta content="yes" name="mobile-web-app-capable">
	<meta content="yes" name="apple-mobile-web-app-capable">
	<link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
	<link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
	<link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
	<link href="/site.webmanifest" rel="manifest">
	<!-- No webfont CDN: it would disclose every visitor's IP to a third party
	     (poor fit for a self-hosted clipboard) and break air-gapped installs.
	     --font-sans / --font-mono in index.css still prefer Inter and JetBrains
	     Mono when installed locally, and fall back to system faces otherwise. -->
	<script>
		(function () {
			try {
				var saved = localStorage.getItem('theme');
				var resolved = saved === 'light' || saved === 'dark'
					? saved
					: (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = resolved;
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		})();
	</script>
</head>
<body>
	<div id="root"></div>
	<script src="/src/main.jsx" type="module"></script>
</body>
</html>
